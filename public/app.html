<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bullion Dealer Pro | Precious Metals Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/bdp-v3.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute">
<symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/><path d="M16 6h3v3"/></symbol>
<symbol id="i-bars" viewBox="0 0 24 24"><path d="M4 16h7l2 4H2zM13 14h7l2 4h-8zM9 8h7l2 4h-8z"/></symbol>
<symbol id="i-coins" viewBox="0 0 24 24"><ellipse cx="8" cy="7" rx="5" ry="2.5"/><path d="M3 7v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5V7"/><ellipse cx="16" cy="14" rx="5" ry="2.5"/><path d="M11 14v4c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4"/></symbol>
<symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 15c1.7 1.2 4.3 1.2 6 0M9 10c0-2 1.3-3.5 3-3.5s3 1.5 3 3.5c0 1.5-.7 2.2-1.5 3H10.5C9.7 12.2 9 11.5 9 10z"/></symbol>
<symbol id="i-note" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 8h2M16 16h2"/></symbol>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><rect x="8" y="6" width="8" height="3"/><path d="M8 13h1M12 13h1M16 13h1M8 17h1M12 17h1M16 17h1"/></symbol>
<symbol id="i-tools" viewBox="0 0 24 24"><path d="M14 6l4-3 3 3-3 4M13 7l4 4-9 9H4v-4z"/><path d="M5 5l4 4"/></symbol>
<symbol id="i-box" viewBox="0 0 24 24"><path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17h12l-2-3V9a4 4 0 0 0-8 0v5zM10 20h4"/></symbol>
<symbol id="i-news" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M4 5c3-1 5 0 8 2v13c-3-2-5-3-8-2zM20 5c-3-1-5 0-8 2v13c3-2 5-3 8-2z"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2 7.5 14 3 9.6l6.2-.9z"/></symbol>
<symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12l2-1-2-4-2 1a7 7 0 0 0-2-1l-.3-2h-5.4L9 7a7 7 0 0 0-2 1L5 7l-2 4 2 1a7 7 0 0 0 0 2l-2 1 2 4 2-1a7 7 0 0 0 2 1l.3 2h5.4l.3-2a7 7 0 0 0 2-1l2 1 2-4-2-1a7 7 0 0 0 0-2z"/></symbol>
</svg>

<div class="cinematic-banner bdp-mountain-banner-v328" role="banner" aria-label="Bullion Dealer Pro">
  <div class="banner-overlay"></div>
  <div class="banner-brand-lockup-v328">
    <img class="banner-primary-logo-v328" src="/bdp-primary-logo.png" alt="Bullion Dealer Pro logo">
    <div class="banner-company-name-v328">BULLION DEALER PRO</div>
    <div class="banner-tagline-v328">PRECIOUS METALS INTELLIGENCE</div>
  </div>
</div>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand" onclick="go('dashboard')" role="button" tabindex="0" title="Open Dashboard">
    <img src="/bdp-primary-logo.png" alt="BDP">
    <div><strong>BULLION</strong><b>DEALER PRO</b><small>PRECIOUS METALS INTELLIGENCE</small></div>
  </div>
  <nav id="sideNav" aria-label="Primary navigation"></nav>
  <div class="pro-card">
    <small>UPGRADE TO</small><h3>◇ PRO</h3>
    <ul><li>Advanced Tools</li><li>Real-Time Alerts</li><li>Inventory Tracking</li><li>Exclusive Data</li></ul>
    <a href="/pricing">UPGRADE NOW</a>
  </div>
</aside>

<div class="main">
<header class="topbar">
  <div class="topbar-title">
    <span class="mini-brand">BDP</span>
    <span id="currentCenterLabel">DASHBOARD</span>
  </div>
  <button class="mobile-menu" id="menuBtn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
  <div class="market-strip" id="marketStrip"></div>
  <div class="utilities">
    <div class="util-menu" id="utilMenu">
      <button class="util-menu-btn" onclick="toggleUtilMenu(event)" aria-label="Settings and tools" aria-expanded="false">☰<span>Menu</span></button>
      <div class="util-menu-dropdown" id="utilMenuDropdown">
        <button onclick="closeUtilMenu();go('alerts')"><svg><use href="#i-bell"/></svg><span>Price Alerts</span></button>
        <button onclick="closeUtilMenu();openUtility('watchlist')"><svg><use href="#i-star"/></svg><span>Metal Watchlist</span></button>
        <button onclick="closeUtilMenu();openUtility('converter')"><span>⇄</span><span>Weight Converter</span></button>
        <button onclick="closeUtilMenu();go('account')"><svg><use href="#i-settings"/></svg><span>Settings</span></button>
        <a class="pro-pill" href="/pricing">◇ PRO</a>
      </div>
    </div>
  </div>
</header>
<main id="page"></main>
</div>
</div>




<div class="utility-backdrop" id="utilityBackdrop" onclick="closeUtility()"></div>
<section class="utility-panel" id="utilityPanel" role="dialog" aria-modal="true" aria-labelledby="utilityTitle" aria-hidden="true" tabindex="-1">
  <header class="utility-head">
    <div><small>BDP QUICK TOOL</small><strong id="utilityTitle">WATCHLIST</strong></div>
    <button onclick="closeUtility()" aria-label="Close quick tool">×</button>
  </header>
  <div class="utility-body" id="utilityBody"></div>
</section>

<div class="engine-backdrop" id="engineBackdrop" onclick="closeClassic()"></div>
<section class="engine-drawer" id="engineDrawer" role="dialog" aria-modal="true" aria-labelledby="engineTitle" aria-hidden="true" tabindex="-1">
  <header class="engine-head">
    <div>
      <small>BDP WORKING ENGINE</small>
      <strong id="engineTitle">Tool</strong>
    </div>
    <div class="engine-actions">
      <a id="engineOpenTab" href="/app" target="_blank" rel="noopener">OPEN FULL ↗</a>
      <button onclick="closeClassic()" aria-label="Close">×</button>
    </div>
  </header>
  <iframe id="engineFrame" title="Bullion Dealer Pro working tool"></iframe>
</section>

<script src="/collection-sets.js"></script>
<script src="/bdp-v3.js"></script>
</body>
</html>
